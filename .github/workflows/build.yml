name: Build

on:
  push:
    branches: [ master ]
    paths:
      - ".github/workflows/build.yml"
      - "build.py"
      - "acceptance.py"
      - "publish.py"
      - "download_page.py"
      - "download_page.css"
      - "releases.json"
      - "sources.sha256"
      - "*.patch"
  pull_request:
    branches: [ master ]
    paths:
      - ".github/workflows/build.yml"
      - "build.py"
      - "acceptance.py"
      - "publish.py"
      - "download_page.py"
      - "download_page.css"
      - "releases.json"
      - "sources.sha256"
      - "*.patch"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "LLVM major versions to build again as a new revision, e.g. '22 23'"
        required: false
        default: ""
      dry-run:
        description: "Only print what would be copied and published"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be uploading a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_REPO: ${{ github.repository }}
  DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}

jobs:
  plan:
    # Each LLVM version has its own release (e.g. llvm-22.1.8) and is built only once.
    # The plan lists versions to copy out of the latest combined release (seed)
    # and versions that have no release yet (builds). See publish.py.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.plan.outputs.seed }}
      builds: ${{ steps.plan.outputs.builds }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      has-seed: ${{ steps.plan.outputs.has-seed }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        env:
          # The base commit, not the branch name: this repository also has an
          # old tag called "master", which a fetch by name picks up instead.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show FETCH_HEAD:releases.json > "$RUNNER_TEMP/base-releases.json"
          # Changing only the action versions in this workflow (`uses:` lines,
          # e.g. Dependabot updates) does not change how LLVM is built, so it
          # does not trigger the test builds.
          strip_uses() { grep -vE '^[[:space:]]*(- )?uses:' || true; }
          if git diff --quiet FETCH_HEAD HEAD -- build.py acceptance.py '*.patch' \
            && diff -q <(git show FETCH_HEAD:.github/workflows/build.yml | strip_uses) \
                       <(strip_uses < .github/workflows/build.yml) > /dev/null; then
            echo "BUILD_INPUTS_CHANGED=" >> "$GITHUB_ENV"
          else
            echo "BUILD_INPUTS_CHANGED=--build-inputs-changed" >> "$GITHUB_ENV"
          fi
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            python3 publish.py plan --event "$EVENT" \
              --base-releases "$RUNNER_TEMP/base-releases.json" $BUILD_INPUTS_CHANGED
          else
            python3 publish.py plan --event "$EVENT" --rebuild "$REBUILD"
          fi
  seed:
    # One-time move to per-version releases: copy the existing binaries of a
    # version out of the latest combined release instead of building them again.
    needs: plan
    # Releases are only written from master; other branches can only dry-run.
    if: >-
      github.event_name != 'pull_request' && needs.plan.outputs.has-seed == 'true'
      && (github.ref == 'refs/heads/master' || inputs.dry-run)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.plan.outputs.seed) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy LLVM ${{ matrix.version }} into ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
          FROM: ${{ needs.plan.outputs.latest }}
        run: python3 publish.py seed --version "$VERSION" --tag "$TAG" --from-tag "$FROM" $DRY_RUN
  build:
    needs: plan
    if: needs.plan.outputs.has-builds == 'true' && !inputs.dry-run
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE: '${{ matrix.release }}'
      suffix: '${{ matrix.clang-version }}_${{ matrix.os }}-${{ matrix.arch }}'
    steps:
    - name: Download build script and patches
      # We download a tarball of this repo, as the presence of a .git directory leaks
      # The commit hash of this repository into the clang binaries
      shell: bash
      run: curl -sL https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz | tar xvz --strip 1
    - name: Build
      shell: bash
      run: python3 build.py --version "${{ matrix.clang-version }}" --platform ${{ matrix.platform }}
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: clang-tools-${{ matrix.release }}-${{ env.suffix }}
        path: |
          ${{ matrix.release }}/build/**/clang-*-${{ env.suffix }}*
          ${{ matrix.release }}/build/**/llvm-*-${{ env.suffix }}*
          ${{ matrix.release }}/build/**/SHA512SUMS
          ${{ matrix.release }}/build/**/buildinfo-${{ env.suffix }}.json
        # ** covers both bin/ (Linux/macOS) and MinSizeRel/bin/ (Windows)
        # clang-* matches clang-format, clang-tidy, clang-query, clang-scan-deps, etc.
        # llvm-* matches llvm-cov, llvm-profdata, llvm-symbolizer
        # buildinfo-*.json records how this platform was built (BUILDINFO.json)
        retention-days: 3
    - name: Upload clang's headers and LLVM's license
      # The same for every platform. This platform builds every LLVM target,
      # so its headers include the ARM and RISC-V ones. See build.py.
      if: matrix.platform == 'linux-amd64'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: common-files-${{ matrix.clang-version }}
        path: ${{ matrix.release }}/common/
        retention-days: 3
  acceptance:
    # Installs each platform's binaries with the headers that will be
    # published, the way users get them, and runs them on test code
    # (acceptance.py). publish-version only publishes a version when every
    # platform passed.
    needs: [plan, build]
    # Also when some builds failed, so the other versions can be published;
    # not when the run was cancelled.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.has-builds == 'true' && !inputs.dry-run
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      suffix: '${{ matrix.clang-version }}_${{ matrix.os }}-${{ matrix.arch }}'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download the LLVM ${{ matrix.clang-version }} binaries for ${{ matrix.platform }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: clang-tools-${{ matrix.release }}-${{ env.suffix }}
        path: files
    - name: Download clang's headers
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: common-files-${{ matrix.clang-version }}
        path: files/common
    - name: Run the binaries on test code
      shell: bash
      env:
        VERSION: ${{ matrix.clang-version }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        python3 acceptance.py --version "$VERSION" --platform "$PLATFORM" \
          --files files --report "results/${suffix}.json"
    - name: Upload the result
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: acceptance-${{ env.suffix }}
        path: results/
        retention-days: 3
  publish-version:
    # A version is published only when all of its platforms built and passed
    # the acceptance tests. A failure in one version does not hold back the
    # others.
    needs: [plan, build, acceptance]
    if: >-
      always() && github.event_name != 'pull_request' && !inputs.dry-run
      && github.ref == 'refs/heads/master'
      && needs.plan.outputs.has-builds == 'true'
    permissions:
      contents: write
      # For the build provenance attestations of the binaries.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download LLVM ${{ matrix.version }} artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: 'clang-tools-*-${{ matrix.version }}_*'
      - name: Download clang's headers and LLVM's license
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: common-files-${{ matrix.version }}
          path: artifacts/common
      - name: Download the acceptance results of LLVM ${{ matrix.version }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: accepted
          pattern: 'acceptance-${{ matrix.version }}_*'
          merge-multiple: true
      - name: Check LLVM ${{ matrix.version }} and write BUILDINFO.json
        # Fails unless every platform built and passed the acceptance tests.
        # Lists every file of the release for the attestation.
        env:
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 publish.py prepare --version "$VERSION" --tag "$TAG" \
            --artifacts artifacts --accepted accepted \
            --commit "$GITHUB_SHA" --run-url "$RUN_URL" \
            --subjects "$RUNNER_TEMP/files.sha256"
          cat "$RUNNER_TEMP/files.sha256"
      - name: Attest build provenance of LLVM ${{ matrix.version }}
        # Records, signed and in Sigstore's public log, that each file was
        # built by this workflow run from this commit. Users check it with
        # `gh attestation verify <file> --repo <this repository>`. This runs
        # before the release is published, so no release goes out without it.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/files.sha256
      - name: Publish ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 publish.py version --version "$VERSION" --tag "$TAG" \
            --artifacts artifacts --commit "$GITHUB_SHA" --run-url "$RUN_URL"
  index:
    # index.json lists every file of every supported version (URL, size,
    # SHA-512). Downstream tools read it instead of one release that holds
    # everything. If a version's new build failed, the previous release of
    # that LLVM major stays in the index.
    needs: [plan, seed, publish-version]
    if: >-
      always() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/master' || inputs.dry-run)
      && needs.plan.result == 'success'
      && needs.seed.result != 'failure' && needs.seed.result != 'cancelled'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write index.json and index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 publish.py index --output site
          python3 -c "import json; d = json.load(open('site/index.json')); print(json.dumps({v: i['tag'] for v, i in d['versions'].items()}, indent=2))"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy-index:
    needs: index
    if: >-
      always() && needs.index.result == 'success'
      && github.ref == 'refs/heads/master' && !inputs.dry-run
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
